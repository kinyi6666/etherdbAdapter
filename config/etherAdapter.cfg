# ============================================================================
# etherAdapter — main configuration (INI style)
#
# Copy this file next to etherAdapter.exe (default lookup:
# <exe dir>\etherAdapter.cfg) or pass an explicit path with -c <file>.
# Per-device protocol configuration lives in the SQLite configuration
# database (see [sqlite].path below), NOT in this file.
# ============================================================================

[server]
# Additional listen ports besides the local_server_port values declared in
# device_table (comma separated). Usually left empty — the adapter listens on
# every distinct device_table.local_server_port.
extraListenPorts =
maxConnections = 1024

[sqlite]
# Configuration database with device_table / data_header_table /
# data_proto_table. A relative path resolves against the executable directory.
# Create it with:  csv2sqlite config\etherAdapter.db <csv dir>
path = config/etherAdapter.db

[etherdb]
# EtherDB server connection.
host = 127.0.0.1
port = 7040
user = root
password = etherdbdata
# Target database (created on start when createDatabase = true, then USE'd).
db = adapter
createDatabase = true
# Create one table per device (<device_id>: ts TIMESTAMP + field columns).
createTables = true
# Rows per inserted batch, and how long a partial batch may sit before it is
# flushed (per device). Bigger batches = higher insert throughput.
batchRows = 4000
flushIntervalMs = 20

[parse]
# How data_header_table.frame_len is interpreted:
#   auto    - probe once per protocol at runtime (recommended)
#   total   - frame_len counts the whole frame including flags
#   payload - frame_len counts the payload only (flags excluded)
frameLenMode = auto

[http]
# HTTP ingest port. 0 = derive from device_table (the local_server_port of
# conn_proto=http(3) devices) — exactly ONE HTTP server is started.
# Devices POST a flat JSON object whose keys are data_proto_table.field_name:
#   {"item1": 12.5, "item2": 7}
port = 0

[modbus]
# Register-read polling interval for modbus(2) devices (ms).
# Request layout (all fields from data_header_table unit/fun_code/data/read_count):
#   [transId 2][0x0000 2][length=6 2][unit 1][funCode 1][data 2][readCount 2]
# Response data is expected on the unified ingest port (local_server_port).
pollIntervalMs = 3000
# Connect timeout for the device request link (ms).
connectTimeoutMs = 1500

[log]
# Log directory (relative paths resolve against the executable directory).
dir = log
# trace | debug | info | warn | error
level = info

[zmq]
# Publish path (design: parse -> publish queue -> ZMQ PUB). Reserved — not
# implemented yet: enabled = false is a zero-cost no-op; enabled = true copies
# batches into the publish queue and drains/drops them (stub).
enabled = false
pubEndpoint = tcp://*:5555
